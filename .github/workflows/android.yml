name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the test APK as a release download
    env:
      # Without these the app runs in demo mode (sample stations, code 123456).
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      # Test build anyone can install on an Android phone (allow "unknown sources").
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: poinderecharge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Same APK as a direct link for phones (no zip, no GitHub login):
      # https://github.com/I-Rachade/Greenpoint/releases/download/android-test/poinderecharge-test.apk
      - name: Publish test APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/poinderecharge-test.apk"
          if ! gh release view android-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create android-test --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Android Test-APK" --notes "Neueste Test-Version der Android-App (Demo-Modus, Code 123456). Wird bei jedem Build ersetzt."
          fi
          gh release upload android-test "$RUNNER_TEMP/poinderecharge-test.apk" --repo "$GITHUB_REPOSITORY" --clobber

      # Signed bundle for Google Play, only once the upload key is stored as GitHub secrets.
      - name: Build signed app bundle
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # A store build must talk to the real backend, never ship the demo (it offers staff/admin logins).
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY repository variables before building for Google Play."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != '' }}
        with:
          name: poinderecharge-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
