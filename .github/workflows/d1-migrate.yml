name: D1 migrations

# Applies worker/migrations to the production D1 database (same as `npm run db:migrate`).
# Runs when new migrations reach main, or by hand from the Actions tab.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (permission: D1 edit) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths: ["worker/migrations/**"]
  workflow_dispatch:

concurrency:
  group: d1-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID first."
            exit 1
          fi
          npx wrangler d1 migrations list DB --remote
          npx wrangler d1 migrations apply DB --remote
