name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: these jobs only check and build.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The production build (as Cloudflare and the mobile apps make it) must not ship the
      # in-browser demo backend: its marker is the demo's storage key (src/lib/backend/demo.ts).
      - run: npm run build
        env:
          NEXT_PUBLIC_BACKEND: cloudflare
      - run: |
          if grep -rl "poinderecharge-demo" out; then
            echo "The production build contains the demo backend."
            exit 1
          fi
